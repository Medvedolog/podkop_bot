name: one-shot-ts-preflight
on:
  push:
    branches:
      - dev/0.19.18-tailscale-preflight
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/0.19.18-tailscale-preflight
      - name: Patch bot
        run: python3 .github/scripts/patch_ts_preflight.py
      - name: Validate
        run: |
          sh -n podkop_bot.sh
          grep -q '_ts_standalone_running()' podkop_bot.sh
          grep -q 'ts_add_confirm' podkop_bot.sh
          grep -q 'ts_ec_' podkop_bot.sh
      - name: Commit and clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-ts-preflight.yml .github/scripts/patch_ts_preflight.py
          git add podkop_bot.sh
          git commit -m '0.19.18: guard tsnet against standalone tailscaled'
          git push origin HEAD:dev/0.19.18-tailscale-preflight
