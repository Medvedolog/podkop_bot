name: debug-r59-callback

on:
  push:
    branches: [dev/0.19.18-tailscale-multiprovider]
    paths: ['.github/workflows/debug-r59-callback.yml']

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev/0.19.18-tailscale-multiprovider
      - name: Extract callback snippets
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path
          p=Path('podkop_bot.sh')
          lines=p.read_text().splitlines()
          needles=['ts_ld_', 'ts_ldc_', 'ts_add', 'cmd_server_instances', 'callback_query', 'callback_data', '_handle_bot']
          hits=[]
          for i,l in enumerate(lines):
              if any(n in l for n in needles):
                  hits.append(i)
          ranges=[]
          for i in hits:
              a=max(0,i-12); b=min(len(lines),i+13)
              if ranges and a <= ranges[-1][1]+2:
                  ranges[-1]=(ranges[-1][0],max(ranges[-1][1],b))
              else:
                  ranges.append((a,b))
          out=[]
          for a,b in ranges:
              out.append(f'\n===== lines {a+1}-{b} =====')
              out.extend(f'{j+1:06d}: {lines[j]}' for j in range(a,b))
          Path('.github/debug-r59-callback.txt').write_text('\n'.join(out)+'\n')
          PY
      - name: Commit debug extract
        run: |
          git config user.name medvedolog
          git config user.email tenkayyy8@gmail.com
          git add .github/debug-r59-callback.txt
          git commit -m 'ci: capture r59 callback snippets'
          git push origin HEAD:dev/0.19.18-tailscale-multiprovider
