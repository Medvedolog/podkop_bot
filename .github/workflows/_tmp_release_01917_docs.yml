name: tmp-release-0.19.17-docs
on:
  push:
    branches: [dev/0.19.17-security-hardening]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/0.19.17-security-hardening
          fetch-depth: 0
      - name: Sync release docs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('README.md'); s=p.read_text()
          s=s.replace('# 🤖 podkop_bot 0.19.13', '# 🤖 podkop_bot 0.19.17', 1)
          s=s.replace('version-0.19.13-blue', 'version-0.19.17-blue', 1)
          s=s.replace('Бот: v0.19.12', 'Бот: v0.19.17', 1)
          p.write_text(s)

          p=Path('CHANGELOG.md'); s=p.read_text()
          marker='## v0.19.17\n\n'
          release='''## v0.19.17\n\n- **ANTI-FLAP:** fixed false POLL demotion to emergency Direct routes when the independent Telegram follower sample was incorrectly considered stale. Follower freshness now follows its real cadence, preserving one-event hysteresis without changing authoritative POLL/FAST separation. Field rollout on multiple routers showed a sharp drop in route flapping.\n- **DIAGNOSTICS/UI:** the full Outbound check covers 12 external services, runs in background without blocking Telegram polling, and the dedicated Telegram Bot API check remains available as a separate Runtime action.\n- **SECURITY:** bot-script update/upload is restricted to the primary administrator in a private chat with a fresh 5-minute upload session; anonymous sender_chat access is opt-in and repeated unauthorized actors are rate-limited/temporarily blocked.\n- **LOGGING:** selectable `quiet` / `normal` / `debug` journal verbosity is available from Telegram and LuCI; normal mode suppresses routine telemetry and logs follower state changes plus an hourly summary.\n'''
          assert marker in s
          start=s.index(marker)
          end=s.index('\n---\n', start)
          rest=s[end:]
          p.write_text(s[:start]+release+rest)

          p=Path('CHANGELOG_RUS.md'); s=p.read_text()
          marker='---\n'
          block='''---\n## v0.19.17\n\n- **ИСПРАВЛЕНО (anti-flap):** устранён ложный уход POLL с рабочего прокси на аварийный Direct из-за слишком быстро устаревавшего follower-sample. Freshness теперь привязан к реальному циклу follower; первый подтверждённый сбой по-прежнему удерживается hysteresis, второй может понизить маршрут. Разделение authoritative POLL/FAST не менялось.\n- **ДИАГНОСТИКА И ИНТЕРФЕЙС:** полный Outbound-тест проверяет 12 внешних сервисов и выполняется в фоне, не блокируя Telegram polling; отдельная проверка Telegram Bot API доступна в Runtime.\n- **БЕЗОПАСНОСТЬ:** загрузка/обновление bot-скрипта разрешены только основному администратору в личном чате после явного запуска 5-минутной upload-session. Anonymous sender_chat теперь opt-in; повторные неавторизованные обращения ограничиваются и временно блокируются.\n- **ЖУРНАЛ:** добавлены уровни `Тихий / Обычный / Отладочный` в Telegram и LuCI. Обычный режим убирает рутинную телеметрию, оставляя изменения состояния follower и редкую сводку.\n\n## v0.19.16\n\n- **TRANSPORT:** follower проверяет Telegram `getMe` параллельно через tier1, все tier2 и tier3; при деградированном POLL проверки учащаются.\n- **ANTI-FLAP:** один полный неуспех POLL proxy-cascade удерживается, если независимый follower недавно видел рабочий прокси; второй последовательный сбой может перевести POLL на Direct.\n\n## v0.19.15\n\n- **ИСПРАВЛЕНО:** полный Outbound-тест больше не зависает на шаге 3/4 — ожидаются только собственные worker PID, а не постоянный watchdog.\n- **ОТЗЫВЧИВОСТЬ:** Outbound-тест вынесен в background worker; бот продолжает отвечать на команды во время диагностики.\n\n## v0.19.14\n\n- **ДИАГНОСТИКА:** Telegram-aware transport probe использует реальный Bot API `getMe`; полный Outbound-тест проверяет 12 сервисов и измеряет скорость на объёме до 8 МиБ.\n- **ИНТЕРФЕЙС:** Status ведёт в тот же Outbound flow, а отдельная кнопка проверки Telegram API доступна в Runtime.\n\n'''
          assert s.count(marker)>=1
          p.write_text(s.replace(marker, block, 1))

          p=Path('highlights.txt'); s=p.read_text()
          line='''v0.19.17: найден и исправлен флаппинг, из-за которого бот мог слишком охотно уходить с рабочего прокси на аварийные маршруты. Расширена диагностика Outbound: 12 сервисов и отдельная проверка Telegram API. Загрузка и обновление bot-скрипта ужесточены: только основной администратор, личный чат и короткая upload-сессия. Журнал стал тише и получил уровни подробности.\n\n'''
          if not s.startswith('v0.19.17:'):
              s=line+s
          p.write_text(s)
          PY
      - name: Validate release metadata
        run: |
          test "$(cat version.txt)" = "0.19.17"
          grep -Fq '# 🤖 podkop_bot 0.19.17' README.md
          grep -Fq 'version-0.19.17-blue' README.md
          grep -Fq '## v0.19.17' CHANGELOG.md
          grep -Fq '## v0.19.17' CHANGELOG_RUS.md
          grep -Fq 'v0.19.17:' highlights.txt
          grep -Fq 'BOT_VERSION="0.19.17"' podkop_bot.sh
          sh -n podkop_bot.sh
          git diff --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md CHANGELOG.md CHANGELOG_RUS.md highlights.txt
          git commit -m "docs: finalize 0.19.17 release notes"
          git push origin HEAD:dev/0.19.17-security-hardening
