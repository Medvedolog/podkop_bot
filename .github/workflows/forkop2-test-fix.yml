name: Forkop 2 bot code inspection
on:
  push:
    branches: [main]
    paths: [.github/workflows/forkop2-test-fix.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/funny-pascal-1kzrka
      - name: Find exact source handlers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('podkop_bot.sh').read_text().splitlines()
          pattern=re.compile(r'^([a-zA-Z_][a-zA-Z_0-9]*)\(\) *\{')
          f=[(i,m.group(1)) for i,l in enumerate(s) if (m:=pattern.match(l))]
          terms=('forkop','fk2','mixed','tailscale','clash','urltest','filter','readonly','read_only','service','proxy_card','proxy_detail','select_proxy')
          for i,name in f:
              if any(t in name.lower() for t in terms):
                  print('FN',i+1,name)
          for needle in ('Несовместимое поле Forkop 1.x','Только просмотр (Forkop)','Сервер: Не определён по тегу','Выбрать Clash API','Требуется Podkop','Параметры URLTest'):
              print('\nMATCH',repr(needle))
              indices=[i for i,l in enumerate(s) if needle.lower() in l.lower()]
              for i in indices[:6]:
                  print('AT',i+1)
                  for j in range(max(0,i-12),min(len(s),i+13)):
                      print(f'{j+1}: {s[j][:250]}')
          for first,last in [(90,158),(1070,1165),(1390,1430),(3990,4065),(10090,10235),(15470,15545)]:
              print('\\nRANGE',first,last)
              for j in range(first-1,min(last,len(s))): print(f'{j+1}: {s[j][:350]}')
          PY


      - name: Inspect Forkop 2 URLTest filtering, Mixed and Tailscale
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('podkop_bot.sh').read_text().splitlines()
          needles=['"fkutf_"*','"fkutv_"*','"fk_ut_menu"','"ask_toggle_mixed"','"do_toggle_mixed"','"cmd_set_mixed_port"','"do_set_mixed_port"','"urltest_filters_menu"','"singbox_supports_tailscale"','"wait_ts_url"']
          for needle in needles:
              n=needle.replace('"','').replace('*','')
              indices=[i for i,l in enumerate(s) if n in l]
              print('HIT',needle,[i+1 for i in indices[:30]])
              for i in indices[:3]:
                  first=max(0,i-7);last=min(len(s),i+13)
                  for j in range(first,last): print(f'{j+1}: {s[j][:500]}')
          for first,last in [(14395,14465),(15495,15780),(15780,16010),(1235,1270),(1755,1805),(4045,4110)]:
              print('RANGE',first,last)
              for j in range(first-1,min(last,len(s))): print(f'{j+1}: {s[j][:500]}')
          PY

  repair:
    needs: inspect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/funny-pascal-1kzrka
          persist-credentials: true
      - name: Apply narrowly scoped Forkop2 repairs
        run: python3 tools/fix-forkop2-p0.py
      - name: Syntax and regression tests
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y jq
          sh -n podkop_bot.sh
          sh tools/check-forkop2-render.sh
          sh tools/test-forkop2-subs-urltest.sh
          sh tools/test-forkop2-tailscale-native.sh
      - name: Commit verified fixes to test branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add podkop_bot.sh
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "fix: Forkop 2 URLTest editor and safe Clash switching"
          git push origin HEAD:claude/funny-pascal-1kzrka
