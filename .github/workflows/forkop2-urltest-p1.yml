name: Forkop 2 URLTest filter regression hotfix
on:
  push:
    branches: [main]
    paths: [.github/workflows/forkop2-urltest-p1.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forkop2-urltest-p1
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/funny-pascal-1kzrka
          persist-credentials: true
      - name: Apply tested URLTest filter hotfix
        run: python3 tools/fix-forkop2-urltest-p1.py
      - name: Run static and mocked-Forkop regressions
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y jq
          sh -n podkop_bot.sh
          sh tools/test-forkop2-subs-urltest.sh
          sh tools/check-forkop2-render.sh
          sh tools/test-forkop2-native-clash.sh
          sh tools/test-forkop2-tailscale-native.sh
          grep -Fq 'urltest_settings|urltest_filters_menu)' podkop_bot.sh
          grep -Fq 'Do NOT activate a latent, unused include_outbounds list' podkop_bot.sh
      - name: Commit to experimental branch only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add podkop_bot.sh
          git diff --cached --quiet && { echo "Nothing changed"; exit 1; }
          git commit -m "fix: route Forkop 2 URLTest filters and preserve explicit filter mode"
          git push origin HEAD:claude/funny-pascal-1kzrka
