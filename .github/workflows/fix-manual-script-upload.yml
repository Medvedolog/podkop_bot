name: Fix manual script upload gate

on:
  push:
    branches:
      - dev/0.19.18-poll-warp-rescue

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev/0.19.18-poll-warp-rescue
          fetch-depth: 0
      - name: Apply upload gate fix
        run: python3 tools/fix-upload.py
      - name: Validate bot
        shell: bash
        run: |
          set -euo pipefail
          sh -n podkop_bot.sh
          grep -Fq 'Имя файла может быть любым' podkop_bot.sh
          ! grep -Fq 'podkop_bot*.sh|podkop_bot' podkop_bot.sh
          grep -Fq "grep -q '^[[:space:]]*BOT_VERSION='" podkop_bot.sh
      - name: Commit and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-manual-script-upload.yml tools/fix-upload.py
          git config user.name 'medvedolog-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(upload): accept manually renamed bot scripts'
          git push origin HEAD:dev/0.19.18-poll-warp-rescue
