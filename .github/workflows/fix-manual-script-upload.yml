name: Fix manual script upload gate

on:
  push:
    branches:
      - dev/0.19.18-poll-warp-rescue

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev/0.19.18-poll-warp-rescue
          fetch-depth: 0
      - name: Relax document filename gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('podkop_bot.sh')
          s=p.read_text()

          old='''            _doc_name=$(printf '%s' "$update" | jq -r '.message.document.file_name // empty' 2>/dev/null)
            _doc_size=$(printf '%s' "$update" | jq -r '.message.document.file_size // 0' 2>/dev/null)
            _doc_ok=0
            case "$_doc_name" in
                podkop_bot*.sh|podkop_bot) _doc_ok=1 ;;
            esac
            case "$_doc_size" in ''|*[!0-9]*) _doc_size=0 ;; esac
            # Valid-looking bot script but too large: tell the user explicitly
            # instead of silently ignoring it (which would leave the wait state
            # set and no feedback about why nothing happened).
            if [ "$_doc_ok" = "1" ] && [ "$_doc_size" -gt 2097152 ]; then
'''
          new='''            _doc_name=$(printf '%s' "$update" | jq -r '.message.document.file_name // empty' 2>/dev/null)
            _doc_size=$(printf '%s' "$update" | jq -r '.message.document.file_size // 0' 2>/dev/null)
            case "$_doc_size" in ''|*[!0-9]*) _doc_size=0 ;; esac
            # The explicit upload session is already bound to admin + private chat
            # + chat/user IDs + TTL. Filename is cosmetic and must not be another
            # security gate: Telegram/users routinely rename the same valid script.
            # Accept any document here and decide only from size + file contents.
            if [ "$_doc_size" -gt 2097152 ]; then
'''
          if old not in s:
              raise SystemExit('document filename gate anchor not found')
          s=s.replace(old,new,1)

          old='''            if [ "$_doc_ok" = "1" ] && [ "$_doc_size" -le 2097152 ]; then
'''
          new='''            if [ "$_doc_size" -le 2097152 ]; then
'''
          if old not in s:
              raise SystemExit('document accept condition anchor not found')
          s=s.replace(old,new,1)

          old='''Отправьте файл <code>podkop_bot.sh</code> как документ.\
\
<i>Перед установкой будут проверены shebang, BOT_VERSION и синтаксис.\
'''
          new='''Отправьте файл скрипта как документ. Имя файла может быть любым.\
\
<i>Перед установкой будут проверены shebang, BOT_VERSION и синтаксис.\
'''
          if old not in s:
              raise SystemExit('upload prompt anchor not found')
          s=s.replace(old,new,1)

          # Be tolerant of harmless indentation in a manually supplied script.
          s=s.replace("! grep -q '^BOT_VERSION=' \"$_bot_tmp\"", "! grep -q '^[[:space:]]*BOT_VERSION=' \"$_bot_tmp\"", 1)
          s=s.replace("_upload_ver=$(grep '^BOT_VERSION=' \"$_bot_tmp\" | cut -d'\"' -f2)", "_upload_ver=$(sed -n 's/^[[:space:]]*BOT_VERSION=[\"'\"'\"']\\([^\"'\"'\"']*\\)[\"'\"'\"'].*/\\1/p' \"$_bot_tmp\" | head -n1)", 1)

          p.write_text(s)
          PY
          sh -n podkop_bot.sh
          grep -Fq 'Имя файла может быть любым' podkop_bot.sh
          ! grep -Fq 'podkop_bot*.sh|podkop_bot' podkop_bot.sh
      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-manual-script-upload.yml
          git config user.name 'medvedolog-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(upload): accept manually renamed bot scripts'
          git push origin HEAD:dev/0.19.18-poll-warp-rescue
