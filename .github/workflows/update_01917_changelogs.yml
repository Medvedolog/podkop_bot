name: update-01917-changelogs

on:
  push:
    branches:
      - dev/0.19.17-security-hardening
    paths:
      - .github/workflows/update_01917_changelogs.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: dev/0.19.17-security-hardening
          fetch-depth: 0

      - name: Patch changelogs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          en = Path('CHANGELOG.md')
          text = en.read_text()
          marker = '## v0.19.17\n\n'
          note = '- **FIXED (state machine):** persistent reply-keyboard Status now escapes pending text input. Previously, while a flow such as `wait_admin_id` was active, pressing Status could be consumed as `STATE_INPUT` and validated as a Telegram ID, producing “Invalid ID”. `cmd_status` now clears the pending state and dispatches the normal Status handler.\n'
          if note not in text:
              if marker not in text:
                  raise SystemExit('English changelog marker missing')
              en.write_text(text.replace(marker, marker + note, 1))

          ru = Path('CHANGELOG_RUS.md')
          text = ru.read_text()
          marker = '## v0.19.17\n\n'
          note = '- **ИСПРАВЛЕНО (state machine):** постоянная кнопка `📊 Статус` теперь имеет приоритет над незавершённым текстовым вводом. Раньше при активном состоянии вроде `wait_admin_id` нажатие «Статус» попадало в `STATE_INPUT`, проверялось как Telegram ID и давало «Некорректный ID». Теперь `cmd_status` очищает pending state и вызывает обычный обработчик статуса.\n'
          if note not in text:
              if marker not in text:
                  raise SystemExit('Russian changelog marker missing')
              ru.write_text(text.replace(marker, marker + note, 1))
          PY

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'persistent reply-keyboard Status' CHANGELOG.md
          grep -q 'постоянная кнопка.*Статус' CHANGELOG_RUS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update_01917_changelogs.yml
          git add CHANGELOG.md CHANGELOG_RUS.md
          git commit -m "docs: document pending-state Status regression fix"
          git push origin HEAD:dev/0.19.17-security-hardening
