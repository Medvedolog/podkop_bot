name: inspect-r60
on:
  push:
    branches: [dev/0.19.18-tailscale-multiprovider]
    paths: ['.github/workflows/inspect-r60.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev/0.19.18-tailscale-multiprovider
      - name: Extract tsnet integration
        run: |
          {
            grep -n -B 8 -A 45 '_ts_backend_call' podkop_bot.sh || true
            grep -n -B 10 -A 45 'singbox_supports_tailscale' podkop_bot.sh || true
            grep -n -B 15 -A 80 'cmd_server_instances' podkop_bot.sh | tail -n 260 || true
            grep -n -B 10 -A 35 'ts_ldc_' podkop_bot.sh || true
          } > .github/inspect-r60.txt
      - name: Commit
        run: |
          git config user.name medvedolog
          git config user.email tenkayyy8@gmail.com
          git add .github/inspect-r60.txt
          git commit -m 'ci: capture r60 tsnet integration context'
          git push origin HEAD:dev/0.19.18-tailscale-multiprovider
