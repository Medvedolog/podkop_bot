name: export-r58

on:
  push:
    branches: [dev/0.19.18-tailscale-multiprovider]
    paths: ['.github/workflows/export-r58.yml']

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate and stage
        run: |
          set -eu
          sh -n podkop_bot.sh
          ! grep -E '^[[:space:]]*sing-box[[:space:]]+version' podkop_bot.sh
          mkdir -p out
          cp podkop_bot.sh out/podkop_bot-0.19.18-tailscale-multiprovider-r58.sh
          chmod 0755 out/podkop_bot-0.19.18-tailscale-multiprovider-r58.sh
          sha256sum out/podkop_bot-0.19.18-tailscale-multiprovider-r58.sh > out/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: podkop_bot-0.19.18-tailscale-multiprovider-r58
          path: out/
          if-no-files-found: error
