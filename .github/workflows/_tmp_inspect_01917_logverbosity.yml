name: tmp-inspect-0.19.17-logverbosity
on:
  push:
    branches: [dev/0.19.17-security-hardening]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/0.19.17-security-hardening
      - name: Inspect Telegram settings anchors
        run: |
          echo '=== settings menu literal ==='
          grep -n -A120 -B30 'Настройки бота' podkop_bot.sh | tail -n +1 | head -220 || true
          echo '=== startup notify anchors ==='
          grep -n -A100 -B30 'startup_notify' podkop_bot.sh | tail -n 260 || true
          echo '=== anon anchors ==='
          grep -n -A80 -B20 'allow_anonymous_admins' podkop_bot.sh | tail -n 220 || true
