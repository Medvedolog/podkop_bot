name: r50 sing-box restart alert follow-up
on:
  push:
    branches:
      - dev/0.19.18-poll-warp-rescue
    paths:
      - .github/workflows/r50_singbox_restart_alert.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/0.19.18-poll-warp-rescue
          fetch-depth: 0
      - name: Keep restart statistics single-owned
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('podkop_bot.sh')
          s=p.read_text()
          old='''                logger -t podkop-bot "[Watchdog] sing-box restarted between checks (PID ${last_sb_pid} -> ${curr_sb_pid})."\n                printf '%s\\n' "$(date +%s)" >> "$SB_RESTART_LOG" 2>/dev/null\n                printf 'up' > "$ROUTE_CMD_FILE"\n'''
          new='''                logger -t podkop-bot "[Watchdog] sing-box restarted between checks (PID ${last_sb_pid} -> ${curr_sb_pid})."\n                # Restart statistics remain owned by _traffic_accum_tick(); do not\n                # append SB_RESTART_LOG here or one restart may be counted twice.\n                printf 'up' > "$ROUTE_CMD_FILE"\n'''
          if old not in s:
              raise SystemExit('restart accounting anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
          sh -n podkop_bot.sh
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add podkop_bot.sh
          git commit -m '0.19.18: keep sing-box restart accounting single-owned'
          git push origin HEAD:dev/0.19.18-poll-warp-rescue
