name: Apply 0.19.18 transport patch

on:
  push:
    branches:
      - dev/0.19.18-poll-warp-rescue

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev/0.19.18-poll-warp-rescue
          fetch-depth: 0
      - name: Apply transport fix
        run: |
          set -eu
          python3 tools/patch-transport-v01918.py podkop_bot.sh
          printf '0.19.18\n' > version.txt
          sh -n podkop_bot.sh
          grep -Fq 'PODKOP_TRANSPORT_PATCH_V2' podkop_bot.sh
          grep -Fq 'action=hold_direct' podkop_bot.sh
          grep -Fq 'ROUTE_KEY="warp_rescue"' podkop_bot.sh
      - name: Commit patched source
        run: |
          set -eu
          if git diff --quiet -- podkop_bot.sh version.txt; then
            echo 'transport source already synchronized'
            exit 0
          fi
          git config user.name 'medvedolog-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add podkop_bot.sh version.txt
          git commit -m 'fix(bot): keep POLL on healthy proxy paths and add WARP Rescue'
          git push origin HEAD:dev/0.19.18-poll-warp-rescue
