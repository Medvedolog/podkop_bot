name: tmp-fix-0.19.17-follower-freshness

on:
  push:
    branches:
      - dev/0.19.17-security-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/0.19.17-security-hardening
          fetch-depth: 0
      - name: Patch follower freshness window
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('podkop_bot.sh')
          s = p.read_text()
          old = '''    _hi=$(uci -q get podkop_bot.settings.health_interval 2>/dev/null || echo 60)\n    case "$_hi" in ''|*[!0-9]*) _hi=60 ;; esac\n    _max_age=$((_hi * 2 + 30))\n    [ "$_max_age" -lt 90 ] && _max_age=90\n    [ "$_max_age" -gt 600 ] && _max_age=600\n'''
          new = '''    _hi=$(uci -q get podkop_bot.settings.health_interval 2>/dev/null || echo 60)\n    case "$_hi" in ''|*[!0-9]*) _hi=60 ;; esac\n    # The follower is scheduled every PROBE_EVERY=5 watchdog cycles, not every\n    # health_interval. Keep a good sample valid across two complete follower\n    # periods plus margin, otherwise a healthy proxy can be declared stale just\n    # before the next scheduled probe and POLL falsely demotes to Direct.\n    _max_age=$((_hi * 5 * 2 + 30))\n    [ "$_max_age" -lt 150 ] && _max_age=150\n    [ "$_max_age" -gt 1200 ] && _max_age=1200\n'''
          assert s.count(old) == 1, f'expected one freshness block, found {s.count(old)}'
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Validate
        run: |
          sh -n podkop_bot.sh
          grep -q '_max_age=$((_hi \* 5 \* 2 + 30))' podkop_bot.sh
          git diff --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add podkop_bot.sh
          git commit -m "0.19.17: align follower freshness with real probe cadence"
          git push origin HEAD:dev/0.19.17-security-hardening
