name: debug-r59-handle
on:
  push:
    branches: [dev/0.19.18-tailscale-multiprovider]
    paths: ['.github/workflows/debug-r59-handle.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev/0.19.18-tailscale-multiprovider
      - name: Extract handle_command
        run: |
          python3 - <<'PY'
          from pathlib import Path
          L=Path('podkop_bot.sh').read_text().splitlines()
          for i,l in enumerate(L):
              if l.startswith('handle_command()'):
                  a=max(0,i-10); b=min(len(L),i+260)
                  Path('.github/debug-r59-handle.txt').write_text('\n'.join(f'{j+1}: {L[j]}' for j in range(a,b))+'\n')
                  break
          else:
              raise SystemExit('handle_command not found')
          PY
      - name: Commit
        run: |
          git config user.name medvedolog
          git config user.email tenkayyy8@gmail.com
          git add .github/debug-r59-handle.txt
          git commit -m 'ci: capture r59 handle_command'
          git push origin HEAD:dev/0.19.18-tailscale-multiprovider
