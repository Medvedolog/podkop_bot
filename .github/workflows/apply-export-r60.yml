name: apply-export-r60
on:
  push:
    branches: [dev/0.19.18-tailscale-multiprovider]
    paths: ['.github/workflows/apply-export-r60.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: dev/0.19.18-tailscale-multiprovider
      - name: Apply observer/controller contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('podkop_bot.sh')
          s=p.read_text()
          old='''# Shared tsnet backend for Telegram. Native Forkop, Forkop X and classic Podkop
# converge on the same provider abstraction used by LuCI.
_ts_backend_call() {
    local _method="$1" _payload="${2:-{}}"
    [ -x /usr/libexec/rpcd/podkop_bot_tailscale ] || return 1
    printf '%s' "$_payload" | /usr/libexec/rpcd/podkop_bot_tailscale call "$_method" 2>/dev/null
}
_ts_backend_status() { _ts_backend_call status '{}'; }
_ts_backend_provider() { _ts_backend_status | jq -r '.provider // "none"' 2>/dev/null; }
'''
          new='''# Shared tsnet backend for Telegram. The standalone bot is deliberately
# read-only for Tailscale unless a compatible controller backend is installed.
# This keeps podkop_bot independently useful without pretending it can mutate
# Forkop/Podkop runtime state that it does not own.
TS_BACKEND_API_REQUIRED=1
TS_BACKEND_PATH=/usr/libexec/rpcd/podkop_bot_tailscale

_ts_backend_api_version() {
    [ -x "$TS_BACKEND_PATH" ] || return 1
    "$TS_BACKEND_PATH" list 2>/dev/null | jq -r '.api_version // 0' 2>/dev/null
}
_ts_backend_control_state() {
    [ -x "$TS_BACKEND_PATH" ] || { printf '%s' missing; return 1; }
    local _v
    _v=$(_ts_backend_api_version 2>/dev/null)
    [ "$_v" = "$TS_BACKEND_API_REQUIRED" ] || { printf '%s' incompatible; return 1; }
    printf '%s' ready
}
_ts_backend_control_available() { [ "$(_ts_backend_control_state 2>/dev/null)" = ready ]; }
_ts_backend_call() {
    local _method="$1" _payload="${2:-{}}"
    _ts_backend_control_available || return 2
    printf '%s' "$_payload" | "$TS_BACKEND_PATH" call "$_method" 2>/dev/null
}
_ts_backend_status() { _ts_backend_call status '{}'; }
_ts_backend_provider() { _ts_backend_status | jq -r '.provider // "none"' 2>/dev/null; }
'''
          if old not in s: raise SystemExit('backend helper anchor not found')
          s=s.replace(old,new,1)

          # Management buttons are capability-gated by the controller backend,
          # not merely by sing-box feature support.
          s=s.replace('if singbox_supports_tailscale; then', 'if singbox_supports_tailscale && _ts_backend_control_available; then')
          old2='''                    if [ "$_ts_legacy" = 1 ]; then
                        _ts_toggle_rows="${_ts_toggle_rows}[{\\"text\\":\\"🗑 Удалить старую Tailscale-секцию\\",\\"callback_data\\":\\"ts_ld_${_s}\\"}],"
                    else
'''
          new2='''                    if ! _ts_backend_control_available; then
                        : # observer mode: render status only, never mutation buttons
                    elif [ "$_ts_legacy" = 1 ]; then
                        _ts_toggle_rows="${_ts_toggle_rows}[{\\"text\\":\\"🗑 Удалить старую Tailscale-секцию\\",\\"callback_data\\":\\"ts_ld_${_s}\\"}],"
                    else
'''
          if old2 not in s: raise SystemExit('tailscale toggle anchor not found')
          s=s.replace(old2,new2,1)

          # Existing cards from an older bot must also fail closed. Refresh the
          # services card in observer mode instead of executing stale callbacks.
          old3='''        ts_add|ts_add_confirm|ts_ld_*|ts_ldc_*|ts_e_*|ts_ec_*|ts_x_*|ts_r_*)
            _handle_forkop_ext "$cmd" "$mid" "" "" "$cb_id" ;;
'''
          new3='''        ts_add|ts_add_confirm|ts_ld_*|ts_ldc_*|ts_e_*|ts_ec_*|ts_x_*|ts_r_*)
            if _ts_backend_control_available; then
                _handle_forkop_ext "$cmd" "$mid" "" "" "$cb_id"
            else
                case "$(_ts_backend_control_state 2>/dev/null)" in
                    incompatible) CB_ANSWER_TEXT="Tailscale: backend API несовместим — только наблюдение" ;;
                    *)            CB_ANSWER_TEXT="Tailscale: backend не установлен — только наблюдение" ;;
                esac
                _handle_bot "cmd_server_instances" "$mid" "" ""
            fi
            ;;
'''
          if old3 not in s: raise SystemExit('router ts callback anchor not found')
          s=s.replace(old3,new3,1)

          # Make observer mode explicit on a populated Services card.
          old4='''            local _text_nl
            _text_nl=$(printf '%s' "$_text" | awk '{gsub(/\\\\n/,"\\n")}1')
'''
          new4='''            local _text_nl
            _text_nl=$(printf '%s' "$_text" | awk '{gsub(/\\\\n/,"\\n")}1')
            if ! _ts_backend_control_available; then
                local _ts_ctl_state _ts_ctl_note
                _ts_ctl_state=$(_ts_backend_control_state 2>/dev/null)
                if [ "$_ts_ctl_state" = incompatible ]; then
                    _ts_ctl_note="Установленный backend имеет несовместимую версию API."
                else
                    _ts_ctl_note="Backend управления не установлен."
                fi
                _text_nl="${_text_nl}\n\nℹ️ <b>Tailscale: режим наблюдения.</b> ${_ts_ctl_note}\nСоздание, изменение и удаление появятся автоматически с совместимым backend API v${TS_BACKEND_API_REQUIRED} (luci-app-podkop-bot r60+)."
            fi
'''
          if old4 not in s: raise SystemExit('services text anchor not found')
          s=s.replace(old4,new4,1)

          # Do not claim that overlay/provider-backed creation is a UCI write.
          s=s.replace('Не удалось сохранить Tailscale в UCI — изменение отменено.',
                      'Не удалось сохранить Tailscale через backend — изменение отменено.')

          p.write_text(s)
          PY
          sh -n podkop_bot.sh
          grep -Fq 'TS_BACKEND_API_REQUIRED=1' podkop_bot.sh
          grep -Fq 'Tailscale: режим наблюдения.' podkop_bot.sh
          grep -Fq 'backend API несовместим — только наблюдение' podkop_bot.sh
          grep -Fq 'singbox_supports_tailscale && _ts_backend_control_available' podkop_bot.sh
          ! grep -Fq 'Не удалось сохранить Tailscale в UCI — изменение отменено.' podkop_bot.sh
      - name: Commit r60 bot
        run: |
          git config user.name medvedolog
          git config user.email tenkayyy8@gmail.com
          git add podkop_bot.sh
          git commit -m 'fix: make standalone Tailscale management capability-gated'
          git push origin HEAD:dev/0.19.18-tailscale-multiprovider
      - name: Export standalone
        run: |
          cp podkop_bot.sh podkop_bot-0.19.18-tailscale-multiprovider-r60.sh
          sha256sum podkop_bot-0.19.18-tailscale-multiprovider-r60.sh > podkop_bot-0.19.18-tailscale-multiprovider-r60.SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: podkop_bot-0.19.18-tailscale-multiprovider-r60
          path: |
            podkop_bot-0.19.18-tailscale-multiprovider-r60.sh
            podkop_bot-0.19.18-tailscale-multiprovider-r60.SHA256SUMS
          if-no-files-found: error
