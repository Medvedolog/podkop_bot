name: apply-tsnet-r58

on:
  push:
    branches: [dev/0.19.18-tailscale-multiprovider]
    paths: ['.github/workflows/apply-tsnet-r58.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: dev/0.19.18-tailscale-multiprovider
      - name: Apply patch
        run: |
          set -eu
          git apply --check .github/patches/tsnet-r58.patch
          git apply .github/patches/tsnet-r58.patch
          sh -n podkop_bot.sh
          ! grep -E '^[[:space:]]*sing-box[[:space:]]+version' podkop_bot.sh
          grep -Fq "LC_ALL=C grep -aFq 'with_tailscale'" podkop_bot.sh
          grep -Fq 'ts_ldc_' podkop_bot.sh
          grep -Fq 'Forkop X и sing-box не перезапускались' podkop_bot.sh
      - name: Commit
        run: |
          set -eu
          git config user.name medvedolog
          git config user.email tenkayyy8@gmail.com
          git add podkop_bot.sh
          git commit -m 'fix: handle Forkop X legacy Tailscale safely'
          git push origin HEAD:dev/0.19.18-tailscale-multiprovider
