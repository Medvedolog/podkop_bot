name: Fix WARP Rescue transport UI

on:
  push:
    branches:
      - dev/0.19.18-poll-warp-rescue

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/0.19.18-poll-warp-rescue
          fetch-depth: 0
      - name: Expose WARP Rescue in bot transport screens
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('podkop_bot.sh')
          s=p.read_text()

          def rep(old,new,desc):
              global s
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{desc}: expected 1 anchor, got {n}')
              s=s.replace(old,new,1)

          rep("""                    tier3) printf 'прокси бота' ;;
                    tier4) printf 'напрямую' ;;
""","""                    tier3) printf 'прокси бота' ;;
                    warp_rescue) printf 'WARP Rescue' ;;
                    tier4) printf 'напрямую' ;;
""",'route-key display')

          rep("""            # LAST_ROUTE_FAST holds the current tier key: tier1, tier2_N, tier3, tier4, tier5.
""","""            # LAST_ROUTE_FAST holds the current tier key: tier1, tier2_N, tier3,
            # warp_rescue, tier4 or tier5.
""",'settings chain comment')

          rep("""            if [ \"$cp\" != \"Not set\" ]; then
                _cp_esc=$(html_escape \"$cp\")
                tr_chain=\"${tr_chain}
$(_fmt_tier \"tier3\" \"Прокси бота (${_cp_esc})\")\"
                _tier=$((_tier + 1))
            fi
            if [ \"$tr\" != \"socks\" ]; then
""","""            if [ \"$cp\" != \"Not set\" ]; then
                _cp_esc=$(html_escape \"$cp\")
                tr_chain=\"${tr_chain}
$(_fmt_tier \"tier3\" \"Прокси бота (${_cp_esc})\")\"
                _tier=$((_tier + 1))
            fi
            # WARP Rescue is a real transport tier between configured proxies and
            # Direct. Show it whenever Rescue is enabled; dormant means the
            # Revolver is armed but has not had to start its localhost SOCKS yet.
            local _wr_enabled _wr_port _wr_state
            _wr_enabled=$(_warp_rescue_cfg_get enabled 2>/dev/null || true)
            if [ \"$tr\" != \"direct\" ] && [ \"$_wr_enabled\" = \"1\" ]; then
                _wr_port=$(_warp_rescue_cfg_get socks_port 2>/dev/null || true)
                case \"$_wr_port\" in ''|*[!0-9]*) _wr_port=18191 ;; esac
                if _warp_rescue_pid_alive; then _wr_state=\"ON-AIR\"; else _wr_state=\"ожидание Revolver\"; fi
                tr_chain=\"${tr_chain}
$(_fmt_tier \"warp_rescue\" \"WARP Rescue (127.0.0.1:${_wr_port}, ${_wr_state})\")\"
                _tier=$((_tier + 1))
            fi
            if [ \"$tr\" != \"socks\" ]; then
""",'bot settings chain')

          rep("""            # tier4/tier5 always exist — say so, so the chain has no invisible parts.
            _row_lbl=\"\"; [ \"${LAST_ROUTE:-}\" = \"tier4\" ] && _row_lbl=\" ${E_PLAY}\"
""","""            # WARP Rescue is owned by the Revolver, not edited here, but it
            # must be visible in the same ordered chain because runtime really
            # attempts it before Direct.
            local _wr_enabled _wr_port _wr_state _wr_lat
            _wr_enabled=$(_warp_rescue_cfg_get enabled 2>/dev/null || true)
            if [ \"$_wr_enabled\" = \"1\" ]; then
                _wr_port=$(_warp_rescue_cfg_get socks_port 2>/dev/null || true)
                case \"$_wr_port\" in ''|*[!0-9]*) _wr_port=18191 ;; esac
                _wr_lat=$(grep '^warp_rescue=' \"$SOCKS_PROBE_FILE\" 2>/dev/null | cut -d= -f2 | cut -d' ' -f1)
                if _warp_rescue_pid_alive; then
                    _wr_state=\"ON-AIR${_wr_lat:+ · $_wr_lat}\"
                else
                    _wr_state=\"ожидает Revolver\"
                fi
                _row_lbl=\"\"; [ \"${LAST_ROUTE:-}\" = \"warp_rescue\" ] && _row_lbl=\" ${E_PLAY}\"
                list_text=$(printf '%s\\
\\
<code>warp_rescue</code>%s WARP Rescue <code>socks5h://127.0.0.1:%s</code> — <i>%s</i>' \\
                    \"$list_text\" \"$_row_lbl\" \"$_wr_port\" \"$_wr_state\")
            fi

            # Direct and emergency IPs are the final two tiers.
            _row_lbl=\"\"; [ \"${LAST_ROUTE:-}\" = \"tier4\" ] && _row_lbl=\" ${E_PLAY}\"
""",'proxy chain WARP row')

          rep("""            local _t3_test; _t3_test=$(uci -q get podkop_bot.settings.custom_proxy 2>/dev/null)
            if [ -n \"$_t3_test\" ]; then
                _probe_channel \"$(_proxy_endpoint \"$_t3_test\")\"
                local _t3_show; _t3_show=$(html_escape \"$(_mask_proxy \"$(_proxy_endpoint \"$_t3_test\")\")\")
                _append_channel \"Прокси бота\" \"$_t3_show\"
            fi
            unset -f _probe_channel _append_channel
""","""            local _t3_test; _t3_test=$(uci -q get podkop_bot.settings.custom_proxy 2>/dev/null)
            if [ -n \"$_t3_test\" ]; then
                _probe_channel \"$(_proxy_endpoint \"$_t3_test\")\"
                local _t3_show; _t3_show=$(html_escape \"$(_mask_proxy \"$(_proxy_endpoint \"$_t3_test\")\")\")
                _append_channel \"Прокси бота\" \"$_t3_show\"
            fi
            # Manual \"Проверить все\" really means all runtime tiers. If Rescue
            # is enabled, explicitly arm it through the existing Revolver controller
            # and probe the same localhost SOCKS that the poller would use.
            local _wr_test_enabled _wr_test_proxy
            _wr_test_enabled=$(_warp_rescue_cfg_get enabled 2>/dev/null || true)
            if [ \"$_wr_test_enabled\" = \"1\" ]; then
                _wr_test_proxy=$(_warp_rescue_proxy 1 2>/dev/null || true)
                if [ -n \"$_wr_test_proxy\" ]; then
                    _probe_channel \"$_wr_test_proxy\"
                    _append_channel \"WARP Rescue\" \"$(html_escape \"$_wr_test_proxy\")\"
                else
                    CH_INET_OK=0; CH_INET_MS=\"—\"; CH_TG_OK=0; CH_TG_REACH=0
                    CH_TG_MS=\"—\"; CH_TG_CODE=\"000\"; CH_TG_DETAIL=\"не удалось запустить\"
                    _append_channel \"WARP Rescue\" \"Revolver не поднял SOCKS\"
                fi
            fi
            unset -f _probe_channel _append_channel
""",'check-all WARP probe')

          p.write_text(s)
          PY

          sh -n podkop_bot.sh
          grep -Fq 'warp_rescue) printf '\''WARP Rescue' podkop_bot.sh
          grep -Fq '<code>warp_rescue</code>' podkop_bot.sh
          grep -Fq '_append_channel "WARP Rescue"' podkop_bot.sh
          grep -Fq 'WARP Rescue (127.0.0.1:' podkop_bot.sh

          rm -f .github/workflows/fix-warp-ui-01918.yml
          git config user.name 'medvedolog-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add podkop_bot.sh .github/workflows/fix-warp-ui-01918.yml
          git commit -m 'fix(transport-ui): expose WARP Rescue in the real route chain'
          git push origin HEAD:dev/0.19.18-poll-warp-rescue
