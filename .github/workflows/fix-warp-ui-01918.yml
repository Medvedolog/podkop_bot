name: Fix WARP Rescue transport UI

on:
  push:
    branches:
      - dev/0.19.18-poll-warp-rescue

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/0.19.18-poll-warp-rescue
          fetch-depth: 0
      - name: Patch bot
        run: python3 tools/fix-warp-ui.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          sh -n podkop_bot.sh
          grep -Fq "warp_rescue) printf 'WARP Rescue'" podkop_bot.sh
          grep -Fq '<code>warp_rescue</code>' podkop_bot.sh
          grep -Fq '_append_channel "WARP Rescue"' podkop_bot.sh
          grep -Fq 'WARP Rescue (127.0.0.1:' podkop_bot.sh
      - name: Commit one-shot result
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-warp-ui-01918.yml tools/fix-warp-ui.py
          git config user.name 'medvedolog-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(transport-ui): expose WARP Rescue in the real route chain'
          git push origin HEAD:dev/0.19.18-poll-warp-rescue
