name: Forkop 2 URLTest leaf 0.20.1 patch
on:
  push:
    branches: [main]
    paths: [.github/workflows/forkop2-leaf-0201.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/funny-pascal-1kzrka
          persist-credentials: true
      - name: Apply read-only nested URLTest display fix
        run: python3 tools/fix-forkop2-leaf-0201.py
      - name: Regression test
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y jq
          sh -n podkop_bot.sh
          sh tools/test-forkop2-leaf-0201.sh
          sh tools/test-forkop2-mixed-0201.sh
          sh tools/check-forkop2-render.sh
          sh tools/test-podkop-exp-sources.sh
          test "$(cat version.txt)" = "0.20.1"
      - name: Commit to test branch only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add podkop_bot.sh
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "fix: Forkop2 nested URLTest resolves known leaf human names"
          git push origin HEAD:claude/funny-pascal-1kzrka
