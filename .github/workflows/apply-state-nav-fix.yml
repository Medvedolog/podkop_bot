name: apply-state-nav-fix

on:
  push:
    branches:
      - dev/0.19.17-security-hardening
    paths:
      - .github/workflows/apply-state-nav-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: dev/0.19.17-security-hardening
          fetch-depth: 0

      - name: Patch pending-input navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('podkop_bot.sh')
          text = path.read_text()
          needle = '        # Universal exit: /cancel or Menu always clears state\n'
          insert = (
              '        # Persistent keyboard navigation must win over pending text input.\n'
              '        # normalize_reply_button() maps Status to cmd_status before dispatch.\n'
              '        if [ "$1" = "cmd_status" ]; then\n'
              '            rm -f "$STATE_FILE"\n'
              '            _handle_bot "cmd_status" "$mid" "" ""\n'
              '            return\n'
              '        fi\n\n'
          )
          if text.count(needle) != 1:
              raise SystemExit(f'target marker count is {text.count(needle)}, expected 1')
          path.write_text(text.replace(needle, insert + needle, 1))
          PY

      - name: Validate shell syntax and regression guard
        shell: bash
        run: |
          set -euo pipefail
          bash -n podkop_bot.sh
          dash -n podkop_bot.sh
          grep -A10 'Persistent keyboard navigation must win' podkop_bot.sh | grep -q 'cmd_status'

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-state-nav-fix.yml
          git add podkop_bot.sh
          git commit -m "fix(bot): let Status escape pending input state"
          git push origin HEAD:dev/0.19.17-security-hardening
