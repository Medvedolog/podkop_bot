name: tmp-patch-0.19.17-security

on:
  push:
    branches:
      - dev/0.19.17-security-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/0.19.17-security-hardening
          fetch-depth: 0
      - name: Apply security hardening
        run: python3 .github/tmp_patch_01917.py
      - name: Validate
        run: |
          sh -n podkop_bot.sh
          grep -q 'BOT_VERSION="0.19.17"' podkop_bot.sh
          grep -q 'UPLOAD_SESSION_TTL=300' podkop_bot.sh
          grep -q 'blocked_user_ids' podkop_bot.sh
          grep -q 'action=temp_block' podkop_bot.sh
          ! grep -q 'Unauthorized:.*text=' podkop_bot.sh
          git diff --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add podkop_bot.sh version.txt CHANGELOG.md
          git commit -m "0.19.17: harden Telegram authorization and script upload"
          git push origin HEAD:dev/0.19.17-security-hardening
