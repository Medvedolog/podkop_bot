name: tmp-patch-0.19.16-fix

on:
  push:
    branches:
      - dev/0.19.16-parallel-health-hysteresis

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/0.19.16-parallel-health-hysteresis
          fetch-depth: 0
      - name: Apply staged fix
        run: python3 .github/tmp_fix_01916.py
      - name: Validate
        run: |
          sh -n podkop_bot.sh
          grep -q '^probe_telegram_proxy_latency() {' podkop_bot.sh
          grep -q '\[Follower\] target=telegram_getMe' podkop_bot.sh
          git diff --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add podkop_bot.sh
          git commit -m "0.19.16: fix Telegram follower function"
          git push origin HEAD:dev/0.19.16-parallel-health-hysteresis
